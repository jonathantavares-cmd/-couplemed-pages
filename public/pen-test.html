<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Teste de caneta — CoupleMed</title>
<!--
  Página de diagnóstico (não faz parte do app). Serve para ver exatamente o que
  o Safari do iPad entrega quando a Apple Pencil encosta na tela: se o evento
  chega, com que pointerType, com pressão, e se o traço é cancelado no meio.
  Abrir em /pen-test.html, escrever e ler o painel.
-->
<style>
  :root{--bg:#0d1424;--card:#141d33;--line:#26324d;--txt:#e8eefc;--mut:#94a3c4;--blue:#2768ff;--ok:#31c76a;--bad:#ff4d4f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{display:flex;flex-direction:column;gap:10px;padding:10px}
  h1{margin:0;font-size:16px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  button.on{background:var(--blue);border-color:var(--blue)}
  #env{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut);white-space:pre-wrap}
  #padwrap{position:relative;flex:1;min-height:260px}
  /* as MESMAS defesas do caderno: sem elas o Safari trata o toque como rolagem */
  #pad{position:absolute;inset:0;width:100%;height:100%;background:#fff;border-radius:10px;
       touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #log{height:34vh;overflow:auto;background:#000;border:1px solid var(--line);border-radius:10px;padding:8px;font:11px/1.4 ui-monospace,Menlo,monospace}
  #log b{color:var(--ok)} #log i{color:var(--bad);font-style:normal} #log s{color:#ffd166;text-decoration:none}
  .tag{display:inline-block;padding:1px 6px;border-radius:6px;background:#1d2740;color:var(--mut);font-size:11px}
</style>
</head>
<body>
  <h1>Teste de caneta <span class="tag" id="verdict">escreva no quadro branco</span></h1>
  <div id="env"></div>
  <div class="row">
    <button id="clear">Limpar</button>
    <button id="copy">Copiar log</button>
    <button id="pause">Pausar log</button>
    <button id="raw" class="on">Só eventos importantes</button>
  </div>
  <div id="padwrap"><canvas id="pad"></canvas></div>
  <div id="log"></div>
<script>
(function(){
  var pad = document.getElementById('pad'), log = document.getElementById('log'),
      env = document.getElementById('env'), verdict = document.getElementById('verdict');
  var paused = false, terse = true, lines = [];

  var dpr = Math.min(2, window.devicePixelRatio || 1), ctx = pad.getContext('2d');
  function size(){
    var r = pad.getBoundingClientRect();
    pad.width = Math.round(r.width*dpr); pad.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineCap='round'; ctx.lineJoin='round';
  }
  window.addEventListener('resize', size); size();

  env.textContent =
    'UA: ' + navigator.userAgent + '\n' +
    'PointerEvent: ' + (('PointerEvent' in window) ? 'sim' : 'NÃO') +
    ' · maxTouchPoints: ' + (navigator.maxTouchPoints||0) +
    ' · devicePixelRatio: ' + (window.devicePixelRatio||1) +
    '\ngetCoalescedEvents: ' + (window.PointerEvent && PointerEvent.prototype.getCoalescedEvents ? 'sim' : 'não') +
    ' · touch-action lido: ' + getComputedStyle(pad).touchAction +
    ' · tela: ' + window.innerWidth + '×' + window.innerHeight;

  function put(html, raw){
    lines.push(raw);
    if(paused) return;
    var d = document.createElement('div'); d.innerHTML = html;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    while(log.childNodes.length > 400) log.removeChild(log.firstChild);
  }
  function ev(e, extra){
    var t = e.type, pt = e.pointerType || '?';
    var raw = t + ' pointerType=' + pt +
      ' pressure=' + (e.pressure!==undefined ? (+e.pressure).toFixed(3) : '-') +
      ' w=' + (e.width!==undefined ? e.width : '-') + ' h=' + (e.height!==undefined ? e.height : '-') +
      ' cancelable=' + e.cancelable + ' id=' + e.pointerId + (extra ? ' ' + extra : '');
    var color = t === 'pointercancel' ? 'i' : (pt === 'pen' ? 'b' : (t.indexOf('touch')===0 || t.indexOf('gesture')===0 ? 's' : 'span'));
    put('<' + color + '>' + raw + '</' + color + '>', raw);
  }

  var cur = null, id = null, moves = 0, cancelled = false;
  function pos(e){ var r = pad.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }

  pad.addEventListener('pointerdown', function(e){
    ev(e);
    if(id !== null) return;
    id = e.pointerId; moves = 0; cancelled = false;
    if(e.cancelable) e.preventDefault();
    try{ pad.setPointerCapture(e.pointerId); }catch(err){ put('<i>setPointerCapture falhou: '+err+'</i>', 'capture fail'); }
    var p = pos(e);
    cur = { pen: e.pointerType==='pen', pts:[p[0],p[1]], pr:[e.pressure||0.5] };
    verdict.textContent = e.pointerType === 'pen' ? 'CANETA detectada (pen)' : 'contato tipo: ' + e.pointerType;
    verdict.style.color = e.pointerType === 'pen' ? '#31c76a' : '#ffd166';
  }, {passive:false});

  pad.addEventListener('pointermove', function(e){
    if(e.pointerId !== id) return;
    if(e.cancelable) e.preventDefault();
    moves++;
    var list = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : null;
    var pack = (list && list.length) ? list : [e];
    if(!terse || moves % 12 === 1) ev(e, 'coalesced=' + (list ? list.length : 'n/d') + ' movimentos=' + moves);
    for(var i=0;i<pack.length;i++){
      var q = pos(pack[i]), n = cur.pts.length;
      var dx = q[0]-cur.pts[n-2], dy = q[1]-cur.pts[n-1];
      if(dx*dx+dy*dy < 0.6) continue;
      var pr = cur.pen ? Math.max(.08, pack[i].pressure || .5) : .55;
      ctx.strokeStyle = cur.pen ? '#1d1d1f' : '#2768ff';
      ctx.lineWidth = Math.max(.8, 6*(.45+pr*.95));
      ctx.beginPath(); ctx.moveTo(cur.pts[n-2], cur.pts[n-1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      cur.pts.push(q[0], q[1]);
    }
  }, {passive:false});

  function done(e){
    if(e.pointerId !== id) return;
    ev(e, 'movimentos=' + moves + ' pontos=' + (cur ? cur.pts.length/2 : 0));
    if(e.type === 'pointercancel'){
      cancelled = true;
      verdict.textContent = 'O SAFARI CANCELOU O TRAÇO (pointercancel)';
      verdict.style.color = '#ff4d4f';
    } else if(cur && !cancelled){
      verdict.textContent = (cur.pen ? 'caneta' : e.pointerType) + ': traço completo com ' + (cur.pts.length/2) + ' pontos';
      verdict.style.color = '#31c76a';
    }
    id = null; cur = null;
  }
  pad.addEventListener('pointerup', done);
  pad.addEventListener('pointercancel', done);
  pad.addEventListener('lostpointercapture', function(e){ ev(e); });

  ['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend'].forEach(function(n){
    pad.addEventListener(n, function(e){
      if(e.touches && e.touches[0] && (!terse || n !== 'touchmove')){
        var t = e.touches[0];
        put('<s>' + n + ' touchType=' + (t.touchType || 'n/d') + ' force=' + (t.force !== undefined ? t.force.toFixed(3) : '-') +
            ' raio=' + (t.radiusX !== undefined ? t.radiusX.toFixed(1) : '-') + ' cancelable=' + e.cancelable + '</s>',
            n + ' touchType=' + (t.touchType||'n/d'));
      }
      if(e.cancelable) e.preventDefault();
    }, {passive:false});
  });

  document.getElementById('clear').onclick = function(){
    log.innerHTML = ''; lines = []; ctx.clearRect(0,0,pad.width,pad.height);
    verdict.textContent = 'escreva no quadro branco'; verdict.style.color = '';
  };
  document.getElementById('copy').onclick = function(){
    var txt = env.textContent + '\n----\n' + lines.join('\n');
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ alert('Log copiado.'); },
      function(){ prompt('Copie o log:', txt); });
    else prompt('Copie o log:', txt);
  };
  document.getElementById('pause').onclick = function(){ paused = !paused; this.classList.toggle('on', paused); this.textContent = paused ? 'Continuar log' : 'Pausar log'; };
  document.getElementById('raw').onclick = function(){ terse = !terse; this.classList.toggle('on', terse); this.textContent = terse ? 'Só eventos importantes' : 'Todos os eventos'; };
})();
</script>
</body>
</html>
